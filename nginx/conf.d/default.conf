# ===========================================
# DEFAULT SERVER — SHARED ACROSS ALL PROJECTS
# ===========================================
# Deployed to: /home/murx/shared/nginx/conf.d/default.conf
#
# Handles:
# 1. Certbot ACME challenges (HTTP, port 80)
# 2. Drops unmatched subdomains (security)

# ----- HTTP default server -----
# Serves certbot challenges, drops everything else
server {
    listen 80 default_server;
    server_name _;

    # Certbot webroot challenge — required for SSL cert issuance/renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Drop all other HTTP traffic to unmatched subdomains
    location / {
        return 444;
    }
}

# ----- HTTPS default server -----
# Drops connections to any subdomain without a dedicated server block.
# Prevents probing/scanning of random subdomains.
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/thecodeman.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thecodeman.cloud/privkey.pem;

    return 444;
}
