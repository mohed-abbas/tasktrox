# ===========================================
# TASKTROX — SERVER BLOCK
# ===========================================
# Deployed to: /home/murx/shared/nginx/conf.d/tasktrox.conf
#
# Routes tasktrox.thecodeman.cloud to Tasktrox containers.
# Upstream targets defined in tasktrox-upstream.conf
# (managed by deploy.sh for blue-green switching).

# ----- HTTP → HTTPS redirect -----
server {
    listen 80;
    server_name tasktrox.thecodeman.cloud;

    # Certbot challenge (needed for cert renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

