# ===========================================
# CD — Build, Push to GHCR, Deploy to VPS
# ===========================================
# Runs on every push to main (after PR is merged).
# Can also be triggered manually via workflow_dispatch.
# Concurrency: NEVER cancel a running deploy — could leave VPS in broken state.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_build:
        description: 'Skip image build (env-only redeploy)'
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # ----- Build & Push Images to GHCR -----
  build-and-push:
    name: Build & Push Images
    if: ${{ !inputs.skip_build }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag (git SHA)
        id: meta
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to GHCR using the built-in GITHUB_TOKEN
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build + push frontend (dual-tagged: SHA + latest)
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/tasktrox-frontend:${{ steps.meta.outputs.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/tasktrox-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # Build + push backend (dual-tagged: SHA + latest)
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/tasktrox-backend:${{ steps.meta.outputs.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/tasktrox-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # ----- Full Deploy to VPS (build + blue-green swap) -----
  deploy:
    name: Deploy to VPS
    needs: build-and-push
    if: ${{ !inputs.skip_build }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            export GITHUB_USER="${{ github.repository_owner }}"
            /home/murx/apps/tasktrox/scripts/deploy.sh \
              ${{ needs.build-and-push.outputs.image-tag }} \
              ${{ secrets.GITHUB_TOKEN }}

  # ----- Env-only Redeploy (no build, just restart active containers) -----
  redeploy:
    name: Redeploy (env-only)
    if: ${{ inputs.skip_build == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Redeploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            export GITHUB_USER="${{ github.repository_owner }}"
            ACTIVE_SLOT=$(cat /home/murx/apps/tasktrox/active-slot 2>/dev/null || echo "blue")
            IMAGE_TAG=$(cat /home/murx/apps/tasktrox/current-sha 2>/dev/null || echo "latest")
            export IMAGE_TAG

            echo "Recreating ${ACTIVE_SLOT} containers with updated .env.production..."
            cd /home/murx/apps/tasktrox
            docker compose up -d --pull never --force-recreate \
              "tasktrox-frontend-${ACTIVE_SLOT}" "tasktrox-backend-${ACTIVE_SLOT}"

            # Wait for health checks
            echo "Waiting for containers to become healthy..."
            sleep 15

            # Reload nginx to pick up new container IPs
            docker exec nginx nginx -s reload
            echo "Redeploy complete. Active slot: ${ACTIVE_SLOT}"
