# ===========================================
# SHARED INFRASTRUCTURE — MULTI-PROJECT VPS
# ===========================================
# Deployed to: /home/murx/shared/docker-compose.infra.yml
#
# Provides postgres, redis, nginx, and certbot
# shared across all projects on the VPS.
#
# Networks (proxy-net, data-net) must be created
# BEFORE starting this compose:
#   docker network create proxy-net
#   docker network create data-net

services:
  # ----- PostgreSQL -----
  # Shared database server — each project uses a separate database
  # Create per-project databases:
  #   docker exec postgres createdb -U dbadmin tasktrox_prod
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - data-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----- Redis -----
  # Shared cache/session store — projects use key prefixes for isolation
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - data-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----- Nginx -----
  # Reverse proxy — subdomain routing, SSL termination, WebSocket proxy
  # Config files: ./nginx/conf.d/<project>.conf per project
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - proxy-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ----- Certbot -----
  # Auto-renews SSL certificates every 12 hours
  # Initial cert setup (run once):
  #   docker compose run --rm certbot certonly --webroot \
  #     -w /var/www/certbot \
  #     -d thecodeman.cloud -d tasktrox.thecodeman.cloud
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  # ----- Adminer (debug only) -----
  # Database GUI — only starts with: docker compose --profile debug up adminer
  adminer:
    image: adminer:latest
    container_name: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - data-net
    profiles:
      - debug

volumes:
  postgres_data:
  redis_data:

networks:
  proxy-net:
    external: true
  data-net:
    external: true
